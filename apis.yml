aid: bloxtel-inc
name: Bloxtel, Inc.
description: >-
  Bloxtel, Inc. builds a decentralized private 5G platform that lets enterprises
  deploy standalone 5G networks in hours. Its all-in-one 5G Access Point runs
  Open6GC, Bloxtel's decentralized network core, and pairs with tokenized dSIM
  electronic-SIM technology and a Web3 Operator dApp for configuring networks,
  managing dSIM subscriptions, and AI-powered predictive maintenance. Solutions
  span indoor coverage, SIM-swap protection, neutral hosting, peer nodes, and
  network analytics, targeting lower latency, reduced threat surface, and lower
  cost versus traditional carrier deployments. Backed by 500 Global. As of this
  profile Bloxtel publishes a marketing and lead-generation site only, with no
  public developer portal, API reference, OpenAPI, or SDK yet available.
